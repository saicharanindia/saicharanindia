# ============================================================
# Generate GitHub Metrics SVGs using lowlighter/metrics
# Only generates Stats + Achievements (Languages skipped — no code yet)
# ============================================================

name: 📊 Generate Metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      # ── Card 1: GitHub Stats Overview ─────────────────────────
      - name: 📊 Stats Card
        uses: lowlighter/metrics@latest
        with:
          filename: dist/metrics-overview.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          user: saicharanindia
          template: classic
          base: header, repositories, activity, community
          base_indepth: yes
          repositories_forks: yes
          config_timezone: Asia/Kolkata
          config_animations: yes
          config_display: large
          config_padding: 8%, 12%
          config_output: svg

      # ── Card 2: Achievements ──────────────────────────────────
      - name: 🏆 Achievements Card
        uses: lowlighter/metrics@latest
        with:
          filename: dist/metrics-achievements.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          user: saicharanindia
          template: classic
          base: ""
          plugin_achievements: yes
          plugin_achievements_display: detailed
          plugin_achievements_secrets: yes
          plugin_achievements_limit: 0
          plugin_achievements_threshold: X
          config_timezone: Asia/Kolkata
          config_animations: yes
          config_display: large
          config_padding: 6%, 10%

      # ── Push SVGs to output branch ────────────────────────────
      - name: 🚀 Push to Output Branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: "📊 Auto-update metrics [skip ci]"
          keep_history: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
