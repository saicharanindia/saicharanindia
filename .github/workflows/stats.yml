# ============================================================
# GitHub Actions: Generate Stats Cards as SVG images
# Stored in your own repo — no external service blocking!
# Runs daily and on every push to main
# ============================================================

name: 📊 Generate GitHub Stats Cards

on:
  schedule:
    - cron: "0 */6 * * *"   # Every 6 hours
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 📊 Generate Stats Card
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: saicharanindia
          template: classic
          base: header, activity, community, repositories
          config_timezone: Asia/Kolkata
          config_order: base.header, base.activity, base.community, base.repositories
          filename: dist/metrics.svg
          config_display: large
          config_animations: yes
          config_padding: 0, 8 + 11%

      - name: 📈 Generate Full Metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: saicharanindia
          template: terminal
          base: header, activity
          config_timezone: Asia/Kolkata
          filename: dist/metrics-terminal.svg
          config_animations: yes
