<svg width="800" height="400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
    <linearGradient id="py" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3776AB"/>
      <stop offset="100%" style="stop-color:#FFD43B"/>
    </linearGradient>
    <linearGradient id="js" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#F7DF1E"/>
      <stop offset="100%" style="stop-color:#f0c000"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .bar { animation: grow 1.5s ease-out forwards; transform-origin: left; }
      @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
      .label { font-family: "Segoe UI", sans-serif; fill: #e6edf3; font-size: 13px; font-weight: 600; }
      .pct { font-family: "Segoe UI", sans-serif; fill: #7aa2f7; font-size: 12px; font-weight: 700; }
      .title { font-family: "Segoe UI", sans-serif; fill: #7aa2f7; font-size: 18px; font-weight: 700; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="800" height="400" rx="12" fill="url(#bg)" stroke="#30363d" stroke-width="1"/>

  <!-- Title -->
  <text x="40" y="45" class="title">💻 Most Used Languages</text>
  <line x1="40" y1="58" x2="760" y2="58" stroke="#30363d" stroke-width="1"/>

  <!-- Language bars -->
  <!-- Python 45% -->
  <text x="40" y="90" class="label">Python</text>
  <rect x="160" y="74" width="540" height="20" rx="10" fill="#21262d"/>
  <rect x="160" y="74" width="243" height="20" rx="10" fill="url(#py)" filter="url(#glow)" class="bar"/>
  <text x="712" y="90" class="pct">45%</text>

  <!-- JavaScript 20% -->
  <text x="40" y="130" class="label">JavaScript</text>
  <rect x="160" y="114" width="540" height="20" rx="10" fill="#21262d"/>
  <rect x="160" y="114" width="108" height="20" rx="10" fill="#F7DF1E" class="bar"/>
  <text x="712" y="130" class="pct">20%</text>

  <!-- HTML5 12% -->
  <text x="40" y="170" class="label">HTML5</text>
  <rect x="160" y="154" width="540" height="20" rx="10" fill="#21262d"/>
  <rect x="160" y="154" width="65" height="20" rx="10" fill="#E34F26" class="bar"/>
  <text x="712" y="170" class="pct">12%</text>

  <!-- CSS3 8% -->
  <text x="40" y="210" class="label">CSS3</text>
  <rect x="160" y="194" width="540" height="20" rx="10" fill="#21262d"/>
  <rect x="160" y="194" width="43" height="20" rx="10" fill="#1572B6" class="bar"/>
  <text x="712" y="210" class="pct">8%</text>

  <!-- C++ 7% -->
  <text x="40" y="250" class="label">C++</text>
  <rect x="160" y="234" width="540" height="20" rx="10" fill="#21262d"/>
  <rect x="160" y="234" width="38" height="20" rx="10" fill="#00599C" class="bar"/>
  <text x="712" y="250" class="pct">7%</text>

  <!-- Django 5% -->
  <text x="40" y="290" class="label">Django</text>
  <rect x="160" y="274" width="540" height="20" rx="10" fill="#21262d"/>
  <rect x="160" y="274" width="27" height="20" rx="10" fill="#092E20" class="bar"/>
  <text x="712" y="290" class="pct">5%</text>

  <!-- MySQL 3% -->
  <text x="40" y="330" class="label">MySQL</text>
  <rect x="160" y="314" width="540" height="20" rx="10" fill="#21262d"/>
  <rect x="160" y="314" width="16" height="20" rx="10" fill="#4479A1" class="bar"/>
  <text x="712" y="330" class="pct">3%</text>

  <!-- Footer -->
  <line x1="40" y1="350" x2="760" y2="350" stroke="#30363d" stroke-width="1"/>
  <text x="40" y="375" font-family="Segoe UI" fill="#8b949e" font-size="11">Based on skill proficiency • Updated 2026</text>
  <text x="600" y="375" font-family="Segoe UI" fill="#7aa2f7" font-size="11">github.com/saicharanindia</text>
</svg>